<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>BuckeyeCardCo Show Mode</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui;background:#111827;color:white;margin:0;padding:18px;max-width:620px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin-bottom:4px}.muted{color:#aab3c3;font-size:13px}.panel{background:#1f2937;padding:16px;border-radius:14px;margin:14px 0}input,select,textarea{box-sizing:border-box;width:100%;padding:13px;margin:6px 0 12px;background:#374151;border:1px solid #6b7280;border-radius:9px;color:white;font-size:16px}button{border:0;border-radius:11px;padding:15px;background:#c53030;color:white;font-size:16px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid button{min-height:75px;font-size:20px;background:#374151}.wide{width:100%}.secondary{background:#4b5563}.green{background:#047857}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.line button{padding:7px 12px}.total{font-size:27px;font-weight:800}.hidden{display:none}small{color:#d1d5db}label{font-size:13px;color:#d1d5db}</style></head><body><header><div><h1>BuckeyeCardCo</h1><div class="muted">CARD SHOW · Quick Checkout</div></div><span>🏈</span></header><section class="panel"><label>Show name</label><input id="show" placeholder="e.g. Lima Card Show"><label>Show date</label><input type="date" id="date"></section><section class="panel"><div class="line"><b>Add cards</b><span id="cartcount">0 cards</span></div><div class="grid" id="buttons"></div><button class="wide secondary" style="margin-top:12px" onclick="custom()">+ Custom / Tracked Card</button></section><section class="panel"><b>Current transaction</b><div id="cart" class="muted" style="margin-top:12px">No cards added</div><hr style="border-color:#374151"><div class="line"><span>Transaction total</span><span class="total" id="total">$0.00</span></div><label>Payment</label><select id="payment"><option>Cash</option><option>Venmo</option><option>PayPal</option><option>Zelle</option><option>Card</option><option>Other</option></select><label>Notes (optional)</label><input id="notes" placeholder="Buyer, discount, trade details"><button class="wide green" onclick="checkout()">Save Sale</button><button class="wide secondary" style="margin-top:9px" onclick="clearCart()">Clear Cart</button></section><section class="panel"><div class="line"><b>Saved show sales</b><b id="summary">$0.00</b></div><div id="saved" class="muted">No sales yet</div><button class="wide" onclick="exportCSV()">Export CSV for OneDrive</button><button class="wide secondary" style="margin-top:9px" onclick="backupJSON()">Backup Sales (JSON)</button></section><div class="muted">Sales stay on this device until exported. Keep backups. This version does not automatically sync with OneDrive.</div><script>
const key='buckeye_show_mode_v1';let sales=JSON.parse(localStorage.getItem(key)||'[]'),cart=[];let show=document.getElementById('show'),date=document.getElementById('date');show.value=localStorage.getItem('buckeye_show')||'';date.value=localStorage.getItem('buckeye_date')||new Date().toLocaleDateString('en-CA');show.oninput=()=>localStorage.setItem('buckeye_show',show.value);date.onchange=()=>localStorage.setItem('buckeye_date',date.value);let prices=[1,3,5,10,20,50];document.getElementById('buttons').innerHTML=prices.map(p=>`<button onclick="addBox(${p})">$${p} Box</button>`).join('');function money(n){return '$'+Number(n).toFixed(2)}function addBox(p){cart.push({item:'$'+p+' Box',quantity:1,total:p,cost_basis:0,inventory_id:''});render()}function custom(){let item=prompt('Card description / player:');if(!item)return;let value=prompt('Sale price in dollars:');if(value===null)return;let price=Number(value);if(!Number.isFinite(price)||price<0)return alert('Invalid price');let id=prompt('Business Manager inventory ID (leave blank if not individually tracked):','');if(id===null)return;if(id&&!/^\d+$/.test(id))return alert('Inventory ID must be a number');let cost=prompt('Total cost basis (optional; blank uses inventory cost for tracked card):','0');if(cost===null)return;if(!Number.isFinite(Number(cost))||Number(cost)<0)return alert('Invalid cost');cart.push({item,quantity:1,total:price,cost_basis:Number(cost),inventory_id:id});render()}function render(){document.getElementById('cartcount').textContent=cart.length+' cards';document.getElementById('cart').innerHTML=cart.length?cart.map((c,i)=>`<div class="line"><span>${escapeHTML(c.item)} — ${money(c.total)}</span><button class="secondary" onclick="cart.splice(${i},1);render()">×</button></div>`).join(''):'No cards added';document.getElementById('total').textContent=money(cart.reduce((a,c)=>a+c.total,0));let relevant=sales.filter(s=>s.show_name===show.value&&s.sale_date===date.value);document.getElementById('summary').textContent=money(relevant.reduce((a,s)=>a+Number(s.total),0));document.getElementById('saved').textContent=`${relevant.length} saved card lines · ${new Set(relevant.map(x=>x.order_id)).size} transactions`;}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clearCart(){cart=[];render()}function checkout(){if(!show.value.trim())return alert('Enter show name');if(!cart.length)return alert('Add cards first');let order=crypto.randomUUID();let now=new Date().toISOString();for(let c of cart)sales.push({...c,id:crypto.randomUUID(),order_id:order,show_name:show.value.trim(),sale_date:date.value,payment_method:document.getElementById('payment').value,notes:document.getElementById('notes').value,created_at:now});localStorage.setItem(key,JSON.stringify(sales));cart=[];document.getElementById('notes').value='';render();alert('Sale saved on this device. Export to OneDrive after the show.')}function csvEscape(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}function download(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}function exportCSV(){if(!sales.length)return alert('No saved sales');let fields=['id','order_id','show_name','sale_date','item','quantity','total','cost_basis','inventory_id','payment_method','notes','created_at'];let csv=fields.join(',')+'\r\n'+sales.map(s=>fields.map(f=>csvEscape(s[f])).join(',')).join('\r\n');download('\ufeff'+csv,'BuckeyeCardCo_Show_Sales_'+new Date().toISOString().slice(0,10)+'.csv','text/csv');alert('Save the downloaded CSV to your OneDrive show imports folder. You can export all sales repeatedly; importer skips already imported IDs.')}function backupJSON(){download(JSON.stringify(sales,null,2),'BuckeyeCardCo_Show_Backup.json','application/json')}render();</script></body></html>
